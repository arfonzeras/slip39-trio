name: android-build

# Compiles the app, runs Android lint and checks the MERGED manifest for security regressions
# (no INTERNET permission, no backups, no unguarded exported components).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug --no-daemon

      - name: Merged manifest security check (debug)
        run: |
          m=$(find app/build/intermediates -path '*merged_manifest*debug*' -name AndroidManifest.xml | head -1)
          test -n "$m" || { echo "merged debug manifest not found"; exit 1; }
          python3 scripts/check-manifest.py "$m"

      - name: Merged manifest security check (release)
        run: |
          m=$(find app/build/intermediates -path '*merged_manifest*release*' -name AndroidManifest.xml | head -1)
          test -n "$m" || { echo "merged release manifest not found"; exit 1; }
          python3 scripts/check-manifest.py "$m" --release

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
